[project]
name = "urlshortner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omar_abftah", email = "omarahmedgabrahmed111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "python-json-logger>=4.2.0",
]

[project.scripts]
urlshortner = "urlshortner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.main:app"
